<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemberian Promo Makanan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .promo-card {
            background: #fff;
            border: 1px solid #ddd;
            margin: 10px auto;
            padding: 15px;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .promo-card h3 {
            margin: 0 0 10px 0;
            color: #333;
        }
        .promo-card p {
            color: #555;
        }
        .promo-card button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .promo-card button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Riwayat Pemesanan Anda</h1>
        <div class="promo-card">
            <h3>Restoran: The Flamboyant</h3>
            <p>Pesanan: 3 kali</p>
            <button id="promo-btn" disabled>Ambil Promo</button>
        </div>
    </div>
    <script>
        // Simulasi data dari backend
        const transactionCount = 3; // jumlah pesanan

        // Trigger tombol promo
        const promoButton = document.getElementById('promo-btn');
        if (transactionCount >= 3) {
            promoButton.disabled = false;
        }
        promoButton.addEventListener('click', () => {
            alert('Promo berhasil diterapkan! Anda mendapatkan makanan gratis.');
            // Simulasi panggilan API
            console.log('API: Promo diterapkan untuk transaksi berikutnya.');
        });
    </script>
</body>
</html>
